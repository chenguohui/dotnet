name: Release LoongArch .NET SDK

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: loongson
      tag:
        description: 'LoongArch64 release tag to build and publish'
        required: true
        type: string
        default: v10.0.112-loongarch64
      branding:
        description: '.NET 10.0-release, .NET 11.0-repodefault'
        required: true
        type: string
        default: release
      buildid:
        description: 'dotnet OfficialBuildId'
        required: true
        type: string
        default: 20260822.8

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
    - name: Check tag and release
      run: |
        set -euo pipefail
        tag_name="${{ inputs.tag }}"

        # The build is driven by an existing tag, never by a branch.
        if ! git ls-remote --exit-code --tags https://github.com/${{ inputs.fork }}/dotnet "refs/tags/$tag_name" >/dev/null; then
          echo "::error::tag '$tag_name' does not exist in ${{ inputs.fork }}/dotnet"
          exit 1
        fi

        # GitHub keeps a single release per tag. Deleting a stale release is a
        # manual step, so report it here rather than at the end of the build.
        if curl -sf -o /dev/null -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag_name"; then
          echo "::error::release '$tag_name' already exists in ${{ github.repository }}; delete it before re-running"
          exit 1
        fi

  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - name: linux
            libc: glibc
            docker_tag: azurelinux-3.0-net10.0-cross-loongarch64-lns23
          - name: linux-musl
            libc: musl
            docker_tag: azurelinux-3.0-net10.0-cross-loongarch64-musl
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'

    - name: Clone repository
      run: |
        set -euo pipefail
        git clone --single-branch --depth 1 -b ${{ inputs.tag }} https://github.com/${{ inputs.fork }}/dotnet
        # `clone -b` resolves a branch before a tag of the same name; the build
        # must come from the tag, so bail out if a branch shadowed it.
        if git -C dotnet symbolic-ref -q HEAD >/dev/null; then
          echo "::error::'${{ inputs.tag }}' resolved to a branch; a tag with this name is required"
          exit 1
        fi
        echo "building ${{ inputs.tag }} at $(git -C dotnet rev-parse HEAD)"

    - name: Apply patches
      run: |
        cd dotnet

        # KeepNativeSymbols=true
        sed -i "/<KeepNativeSymbols/ s/true/false/g" src/runtime/Directory.Build.props

        cp -v src/runtime/src/libraries/System.IO.Ports/pkg/runtime.linux-x64.runtime.native.System.IO.Ports.proj src/runtime/src/libraries/System.IO.Ports/pkg/runtime.linux-loongarch64.runtime.native.System.IO.Ports.proj
        cp -v src/runtime/src/libraries/System.IO.Ports/pkg/runtime.linux-x64.runtime.native.System.IO.Ports.proj src/runtime/src/libraries/System.IO.Ports/pkg/runtime.linux-musl-loongarch64.runtime.native.System.IO.Ports.proj

    - name: Build
      run: |
        docker run --platform linux/amd64 --rm -v${{ github.workspace }}/dotnet:/dotnet -w /dotnet -e ROOTFS_DIR=/crossrootfs/loongarch64 \
          ghcr.io/chenguohui/dotnet-buildtools-prereqs-docker:${{ matrix.docker_tag }} \
            ./build.sh --clean-while-building --prep -sb --os ${{ matrix.name }} --rid ${{ matrix.name }}-loongarch64 \
              --arch loongarch64 --branding ${{ inputs.branding }} -p:OfficialBuildId=${{ inputs.buildid }}

    - name: List assets directory
      run: |
        find "${{ github.workspace }}/dotnet/artifacts"
    - name: Upload .NET
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-sdk-${{ matrix.name }}
        path: |
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Private.SourceBuilt.Artifacts.*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Make release
      run: |
        set -euo pipefail
        sudo apt install -y hub

        tag_name="${{ inputs.tag }}"

        # hub(1) requires release to be created inside a git repo; the release is
        # created in the repository this workflow runs in.
        git clone https://${{ secrets.CLONE_TOKEN }}:x-oauth-basic@github.com/${{ github.repository }}.git repo
        cd repo

        # This step only ever attaches a release to an existing tag. If the tag
        # were missing, GitHub would create it from the default branch and the
        # release would point at code that was not built.
        if ! git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
          echo "::error::tag '$tag_name' does not exist in ${{ github.repository }}"
          exit 1
        fi
        echo "attaching release to tag '$tag_name' at $(git rev-parse "refs/tags/$tag_name^{commit}")"

        sdk_paths=$(find ${{ github.workspace }}/artifacts -name 'dotnet-sdk-*.tar.gz')
        psa_paths=$(find ${{ github.workspace }}/artifacts -name 'Private.SourceBuilt.Artifacts.*.tar.gz')
        artifacts=""
        for sdk_path in $sdk_paths; do
          artifacts="$artifacts -a $sdk_path"
        done
        for psa_path in $psa_paths; do
          artifacts="$artifacts -a $psa_path"
        done
        echo "artifacts: $artifacts"

        # docs: https://hub.github.com/hub-release.1.html
        # The tag already exists, so GitHub ignores any target commit and the
        # release lands on the tag: artifacts and generated source archives are
        # all tied to the tagged commit.
        hub release create $artifacts --prerelease -m "$tag_name" "$tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
